<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Nossas Lojas – Print My Case BR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black:   #0d0d0d;
      --white:   #ffffff;
      --bg:      #f5f3ef;
      --border:  #e8e4de;
      --muted:   #8a8680;
      --accent:  #e8410a;
      --header:  52px;
      --sheet-peek: 120px;
    }

    html, body {
      height: 100%; width: 100%;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--black);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
    }

    /* ── HEADER ── */
    header {
      position: fixed; top: 0; left: 0; right: 0;
      height: var(--header); z-index: 900;
      background: var(--black);
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      padding-top: env(safe-area-inset-top);
    }

    .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; flex-shrink: 0; }

    /* Dynamic state legend — built by JS */
    #state-legend {
      display: flex; align-items: center; gap: 10px;
      overflow-x: auto; overflow-y: hidden;
      scrollbar-width: none; -ms-overflow-style: none;
      padding-left: 8px; flex-shrink: 1;
    }
    #state-legend::-webkit-scrollbar { display: none; }
    .leg-item { display: flex; align-items: center; gap: 4px; white-space: nowrap; flex-shrink: 0; }
    .leg-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .leg-label { font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.5); }

    /* ── MAP ── */
    #map {
      position: fixed;
      top: var(--header); left: 0; right: 0; bottom: 0;
      z-index: 1;
    }

    /* ── SEARCH ── */
    #search-wrap {
      position: fixed;
      top: calc(var(--header) + 10px);
      left: 12px; right: 12px;
      z-index: 800;
    }
    #search-input {
      width: 100%; background: white; border: none;
      border-radius: 12px;
      padding: 11px 14px 11px 40px;
      font-size: 14px; font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--black);
      box-shadow: 0 2px 16px rgba(0,0,0,0.12);
      outline: none; -webkit-appearance: none;
    }
    #search-input::placeholder { color: #c0bbb5; }
    .search-icon {
      position: absolute; left: 13px; top: 50%;
      transform: translateY(-50%); color: #c0bbb5; pointer-events: none;
    }
    .search-icon svg { width: 15px; height: 15px; fill: currentColor; display: block; }

    /* ── FILTER PILLS ── */
    #filter-row {
      position: fixed;
      top: calc(var(--header) + 58px);
      left: 0; right: 0;
      z-index: 800;
      display: flex; gap: 7px;
      padding: 0 12px;
      overflow-x: auto; overflow-y: hidden;
      scrollbar-width: none; -ms-overflow-style: none;
      /* prevent layout shift when pills are added */
      flex-wrap: nowrap;
    }
    #filter-row::-webkit-scrollbar { display: none; }

    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 12px;
      background: white; border-radius: 50px;
      border: 2px solid transparent;
      font-size: 12px; font-weight: 700;
      font-family: 'Plus Jakarta Sans', sans-serif;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.09);
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      color: var(--black);
    }
    .pill.active { background: var(--black); color: white; border-color: var(--black); }
    .pill-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .pill-count { font-size: 10px; font-weight: 600; opacity: 0.55; }

    /* ── BOTTOM SHEET ── */
    #sheet {
      position: fixed; left: 0; right: 0; bottom: 0;
      z-index: 850;
      background: white;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -3px 24px rgba(0,0,0,0.12);
      display: flex; flex-direction: column;
      /* peek: only handle + title visible */
      transform: translateY(calc(100% - var(--sheet-peek)));
      transition: transform 0.36s cubic-bezier(0.32, 0.72, 0, 1);
      max-height: calc(100vh - var(--header) - 10px);
      touch-action: none;
    }
    #sheet.expanded { transform: translateY(0); }

    .sheet-handle-area {
      padding: 10px 0 6px; flex-shrink: 0;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      cursor: pointer; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .sheet-handle { width: 36px; height: 4px; background: #ddd; border-radius: 4px; }
    .sheet-title {
      font-size: 11px; font-weight: 700; color: var(--muted);
      letter-spacing: 0.06em; text-transform: uppercase;
    }

    .sheet-list {
      overflow-y: auto; flex: 1;
      padding-bottom: env(safe-area-inset-bottom, 12px);
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    /* Store row */
    .store-row {
      display: flex; align-items: center;
      padding: 12px 16px; gap: 11px;
      border-bottom: 1px solid #f2efe9;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: background 0.1s;
    }
    .store-row:last-child { border-bottom: none; }
    .store-row:active { background: #faf8f5; }

    .store-pin-icon {
      width: 34px; height: 34px; border-radius: 50%;
      display: grid; place-items: center; flex-shrink: 0;
    }
    .store-pin-icon svg { width: 15px; height: 15px; }

    .store-info { flex: 1; min-width: 0; }
    .store-row-name {
      font-size: 13px; font-weight: 700; line-height: 1.3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .store-row-sub { font-size: 11px; color: var(--muted); margin-top: 1px; display: flex; align-items: center; gap: 5px; }
    .store-state-tag {
      font-size: 9px; font-weight: 700; letter-spacing: 0.06em;
      padding: 1px 5px; border-radius: 4px;
    }

    .store-arrow svg { width: 14px; height: 14px; fill: #ccc; display: block; }

    /* ── DETAIL PANEL ── */
    #detail {
      position: fixed; left: 0; right: 0; bottom: 0;
      z-index: 1000;
      background: white;
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -4px 40px rgba(0,0,0,0.18);
      transform: translateY(100%);
      transition: transform 0.33s cubic-bezier(0.32, 0.72, 0, 1);
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
    #detail.open { transform: translateY(0); }

    .detail-handle { width: 36px; height: 4px; background: #e0ddd8; border-radius: 4px; margin: 12px auto 0; }
    .detail-body { padding: 14px 18px 18px; }

    .detail-badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.07em;
      text-transform: uppercase; padding: 3px 9px;
      border-radius: 50px; margin-bottom: 8px;
    }
    .detail-badge-dot { width: 6px; height: 6px; border-radius: 50%; }

    #detail-name { font-size: 19px; font-weight: 800; line-height: 1.2; margin-bottom: 5px; letter-spacing: -0.3px; }
    #detail-addr { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 16px; }

    .detail-actions { display: flex; gap: 9px; }
    #detail-link {
      flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      background: var(--black); color: white; text-decoration: none;
      font-size: 13px; font-weight: 700; padding: 13px 16px; border-radius: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent; touch-action: manipulation;
    }
    #detail-link:active { opacity: 0.8; }
    #detail-link svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0; }

    #detail-close {
      width: 48px; height: 48px; background: #f2efe9; border: none;
      border-radius: 12px; display: grid; place-items: center;
      cursor: pointer; flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    #detail-close svg { width: 18px; height: 18px; fill: var(--muted); }
    #detail-close:active { background: #e8e4de; }

    /* ── LEAFLET ── */
    .leaflet-control-zoom {
      border: none !important;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12) !important;
      border-radius: 12px !important;
      overflow: hidden;
      margin-right: 12px !important;
      margin-bottom: calc(var(--sheet-peek) + 12px) !important;
    }
    .leaflet-control-zoom a {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      font-weight: 700 !important; font-size: 18px !important;
      color: var(--black) !important; background: white !important;
      border: none !important; border-bottom: 1px solid #f2efe9 !important;
      width: 40px !important; height: 40px !important; line-height: 40px !important;
    }
    .leaflet-control-zoom a:last-child { border-bottom: none !important; }
    .leaflet-control-zoom a:active { background: #f5f3ef !important; }
    .leaflet-control-attribution { display: none !important; }

    /* ── DESKTOP ── */
    @media (min-width: 700px) {
      :root { --sheet-peek: 0px; }
      #sheet { display: none !important; }

      #side-panel {
        display: flex !important;
        position: fixed; top: var(--header); left: 0; bottom: 0;
        width: 300px; z-index: 800; background: white;
        border-right: 1px solid var(--border);
        flex-direction: column;
      }
      .side-panel-header {
        padding: 14px 16px 10px; border-bottom: 1px solid #f2efe9; flex-shrink: 0;
      }
      .side-panel-title { font-size: 14px; font-weight: 700; }
      .side-panel-count { font-size: 11px; color: var(--muted); margin-top: 2px; }
      .side-panel-list { overflow-y: auto; flex: 1; }

      #map { left: 300px; }
      #search-wrap { left: 312px; right: 12px; transform: none; }
      #filter-row { left: 300px; padding: 0 12px; }

      #detail {
        left: 300px; right: auto; width: 300px;
        border-radius: 0 20px 20px 0;
        bottom: 0; top: var(--header);
        transform: translateX(-100%);
      }
      #detail.open { transform: translateX(0); }
      .leaflet-control-zoom { margin-bottom: 20px !important; }
    }

    /* ── LOGO IMAGE ── */
    .logo img { height: 30px; width: auto; display: block; }

    /* ── FRANCHISE CTA ── */
    #franchise-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: #25D366; color: white;
      text-decoration: none; font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px; font-weight: 700; white-space: nowrap;
      padding: 7px 11px; border-radius: 50px;
      box-shadow: 0 2px 8px rgba(37,211,102,0.4);
      transition: opacity 0.15s;
      flex-shrink: 0;
    }
    #franchise-btn:active { opacity: 0.8; }
    #franchise-text { display: none; }

    @media (min-width: 480px) {
      #franchise-text { display: inline; }
      #franchise-btn { font-size: 11px; padding: 7px 13px; }
    }
    @media (min-width: 700px) {
      #franchise-btn { font-size: 12px; padding: 8px 15px; }
      .logo img { height: 34px; }
    }
  </style>
</head>

    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
  </span>
  <input type="text" id="search-input" placeholder="Buscar shopping ou cidade…"/>
</div>

<div id="filter-row"><!-- built by JS --></div>

<!-- BOTTOM SHEET (mobile) -->
<div id="sheet">
  <div class="sheet-handle-area" id="sheet-handle">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheet-label">carregando…</div>
  </div>
  <div class="sheet-list" id="sheet-list"></div>
</div>

<!-- SIDE PANEL (desktop) -->
<div id="side-panel" style="display:none">
  <div class="side-panel-header">
    <div class="side-panel-title">Nossas lojas</div>
    <div class="side-panel-count" id="side-label"></div>
  </div>
  <div class="side-panel-list" id="side-list"></div>
</div>

<!-- DETAIL -->
<div id="detail">
  <div class="detail-handle"></div>
  <div class="detail-body">
    <div class="detail-badge" id="detail-badge">
      <span class="detail-badge-dot" id="detail-badge-dot"></span>
      <span id="detail-state-text"></span>
    </div>
    <div id="detail-name"></div>
    <div id="detail-addr"></div>
    <div class="detail-actions">
      <a id="detail-link" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
        Abrir no Google Maps
      </a>
      <button id="detail-close" onclick="closeDetail()">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ─────────────────────────────────────────────
//  DADOS DAS LOJAS
//  Para adicionar novos estados: basta incluir
//  novas entradas com o campo state: "XX"
//  As cores e filtros são gerados automaticamente.
// ─────────────────────────────────────────────
var stores = [
  // SÃO PAULO
  { id:1,  name:"Catarina Fashion Outlet",        city:"São Roque",       state:"SP", address:"Rod. Presidente Castelo Branco, km 60 – São Roque, SP",          lat:-23.4205, lng:-47.1641 },
  { id:2,  name:"Raposo Shopping",                city:"São Paulo",       state:"SP", address:"Rod. Raposo Tavares, km 14,5 – Jd. Boa Vista, São Paulo, SP",    lat:-23.5879, lng:-46.7512 },
  { id:3,  name:"Prado Boulevard",                city:"Campinas",        state:"SP", address:"Av. John Boyd Dunlop, s/n – Prado, Campinas, SP",                lat:-22.9299, lng:-47.1035 },
  { id:4,  name:"Shopping Center 3",              city:"São Paulo",       state:"SP", address:"Av. Paulista, 2064 – Cerqueira César, São Paulo, SP",             lat:-23.5584, lng:-46.6595 },
  { id:5,  name:"Shopping Taboão",                city:"Taboão da Serra", state:"SP", address:"Rod. Régis Bittencourt, km 271,5 – Taboão da Serra, SP",          lat:-23.6143, lng:-46.7769 },
  { id:6,  name:"Shopping Internacional de Guarulhos", city:"Guarulhos", state:"SP", address:"Rod. Presidente Dutra, km 222,5 – Guarulhos, SP",                 lat:-23.4280, lng:-46.4850 },
  { id:7,  name:"Shopping Boulevard Tatuapé",     city:"São Paulo",       state:"SP", address:"Rua Gonçalves Crespo, 78 – Tatuapé, São Paulo, SP",               lat:-23.5393, lng:-46.5768 },
  { id:8,  name:"Shopping Jaraguá",               city:"Araraquara",      state:"SP", address:"Av. Alberto Benassi, 2270 – Jardim dos Manacas, Araraquara, SP",   lat:-21.7886, lng:-48.1940 },
  { id:9,  name:"Parque Shopping Barueri",        city:"Barueri",         state:"SP", address:"R. General Div. Pedro Rodrigues da Silva, 400 – Barueri, SP",     lat:-23.5159, lng:-46.8556 },
  { id:10, name:"Boulevard Mogi Guaçu",           city:"Mogi Guaçu",      state:"SP", address:"Av. Mogi Mirim, 210 – Centro, Mogi Guaçu, SP",                   lat:-22.3700, lng:-46.9440 },
  { id:11, name:"Shopping Metrô Tatuapé",         city:"São Paulo",       state:"SP", address:"Av. Radial Leste, s/n – Tatuapé, São Paulo, SP",                  lat:-23.5418, lng:-46.5763 },
  { id:12, name:"Tietê Plaza Shopping",           city:"São Paulo",       state:"SP", address:"Av. Raimundo P. de Magalhães, 1465 – Pirituba, São Paulo, SP",    lat:-23.5067, lng:-46.7182 },
  { id:13, name:"Shopping Metrô Tucuruvi",        city:"São Paulo",       state:"SP", address:"Av. Dr. Antonio Maria Laet, 566 – Tucuruvi, São Paulo, SP",       lat:-23.4798, lng:-46.6028 },
  { id:14, name:"Shopping Bourbon",               city:"São Paulo",       state:"SP", address:"Rua Turiassu, 2100 – Pompéia, São Paulo, SP",                     lat:-23.5265, lng:-46.6815 },
  { id:15, name:"Extra Ricardo Jafet",            city:"São Paulo",       state:"SP", address:"Av. Ricardo Jafet, 850 – Vila Mariana, São Paulo, SP",             lat:-23.5920, lng:-46.6310 },
  { id:16, name:"Shibata Suzano",                 city:"Suzano",          state:"SP", address:"Av. Antônio Marques Figueira, 1100 – Suzano, SP",                  lat:-23.5430, lng:-46.3120 },
  { id:17, name:"Shopping Metrô Santa Cruz",      city:"São Paulo",       state:"SP", address:"Rua Domingos de Morais, 2564 – Vila Mariana, São Paulo, SP",       lat:-23.5992, lng:-46.6367 },
  { id:18, name:"Shopping Center Vale",           city:"São José dos Campos", state:"SP", address:"Av. Dr. Nelson d'Ávila, 1111 – São José dos Campos, SP",     lat:-23.2219, lng:-45.8960 },
  { id:19, name:"Shopping Campo Limpo",           city:"São Paulo",       state:"SP", address:"Estrada do Campo Limpo, 459 – Vila Prel, São Paulo, SP",           lat:-23.6496, lng:-46.7574 },
  { id:22, name:"Shopping Penha",              city:"São Paulo",       state:"SP", address:"Rua Dr. João Ribeiro, 304 – Penha de França, São Paulo, SP",      lat:-23.5270, lng:-46.5278 },
  // MINAS GERAIS
  { id:20, name:"Via Café Shopping",              city:"Varginha",        state:"MG", address:"Av. Antônio Carlos, 631 – Varginha, MG",                          lat:-21.5556, lng:-45.4313 },
  { id:21, name:"Pátio Central Shopping",         city:"Belo Horizonte",  state:"MG", address:"Av. Barão Homem de Melo, 3390 – Buritis, Belo Horizonte, MG",    lat:-19.9580, lng:-43.9920 },
];

// ─── COLOR PALETTE — add more as needed ───
var STATE_COLORS = {
  SP: { pin: ['#2563eb','#1d4ed8'], bg: '#eef3ff', text: '#2563eb' },
  MG: { pin: ['#e8410a','#c43000'], bg: '#fff1ed', text: '#e8410a' },
  RJ: { pin: ['#059669','#047857'], bg: '#ecfdf5', text: '#059669' },
  RS: { pin: ['#7c3aed','#6d28d9'], bg: '#f5f3ff', text: '#7c3aed' },
  PR: { pin: ['#d97706','#b45309'], bg: '#fffbeb', text: '#d97706' },
  SC: { pin: ['#0891b2','#0e7490'], bg: '#ecfeff', text: '#0891b2' },
  BA: { pin: ['#be185d','#9d174d'], bg: '#fdf2f8', text: '#be185d' },
  GO: { pin: ['#65a30d','#4d7c0f'], bg: '#f7fee7', text: '#65a30d' },
};
var DEFAULT_COLOR = { pin: ['#6b7280','#4b5563'], bg: '#f3f4f6', text: '#6b7280' };

function stateColor(state) {
  return STATE_COLORS[state] || DEFAULT_COLOR;
}

// ─── DISCOVER STATES ───
var stateList = [];
stores.forEach(function(s) {
  if (stateList.indexOf(s.state) === -1) stateList.push(s.state);
});
stateList.sort();

// ─── HEADER LEGEND ───
var legendEl = document.getElementById('state-legend');
stateList.forEach(function(st) {
  var c = stateColor(st);
  var item = document.createElement('span');
  item.className = 'leg-item';
  item.innerHTML = '<span class="leg-dot" style="background:'+c.pin[0]+'"></span>'
    + '<span class="leg-label">'+st+'</span>';
  legendEl.appendChild(item);
});

// ─── FILTER PILLS ───
var activeFilter = 'all';
var filterRow = document.getElementById('filter-row');

function buildPills() {
  filterRow.innerHTML = '';

  // "Todas" pill
  var allPill = document.createElement('button');
  allPill.className = 'pill' + (activeFilter === 'all' ? ' active' : '');
  allPill.id = 'btn-all';
  allPill.innerHTML = '📍 Todas <span class="pill-count" id="cnt-all">'+stores.length+'</span>';
  allPill.onclick = function() { setFilter('all'); };
  filterRow.appendChild(allPill);

  // One pill per state
  stateList.forEach(function(st) {
    var c = stateColor(st);
    var cnt = stores.filter(function(s){ return s.state === st; }).length;
    var pill = document.createElement('button');
    pill.className = 'pill' + (activeFilter === st ? ' active' : '');
    pill.id = 'btn-' + st;
    pill.innerHTML = '<span class="pill-dot" style="background:' + c.pin[0] + '"></span>'
      + st
      + ' <span class="pill-count" id="cnt-' + st + '">' + cnt + '</span>';
    pill.onclick = (function(state) { return function() { setFilter(state); }; })(st);
    filterRow.appendChild(pill);
  });
}
buildPills();

// ─── MAP ───
var lmap = L.map('map', { zoomControl: false, attributionControl: false }).setView([-22.5, -46.8], 7);
L.control.zoom({ position: 'bottomright' }).addTo(lmap);

L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  subdomains: 'abcd', maxZoom: 20,
  attribution: '© OpenStreetMap contributors © CARTO'
}).addTo(lmap);

// ─── PIN SVG ───
function makePinHtml(state) {
  var c = stateColor(state);
  var g0 = c.pin[0], g1 = c.pin[1];
  var uid = 'g' + state;
  return '<svg xmlns="http://www.w3.org/2000/svg" width="30" height="39" viewBox="0 0 30 39" style="display:block;overflow:visible">'
    + '<defs>'
    + '<linearGradient id="'+uid+'" x1="0%" y1="0%" x2="100%" y2="100%">'
    + '<stop offset="0%" stop-color="'+g0+'"/><stop offset="100%" stop-color="'+g1+'"/>'
    + '</linearGradient>'
    + '<filter id="sh'+state+'" x="-40%" y="-20%" width="180%" height="160%">'
    + '<feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="rgba(0,0,0,0.28)"/>'
    + '</filter>'
    + '</defs>'
    + '<path filter="url(#sh'+state+')" d="M15 1C7.82 1 2 6.82 2 14c0 10.5 13 24 13 24S28 24.5 28 14C28 6.82 22.18 1 15 1z" fill="url(#'+uid+')"/>'
    + '<circle cx="15" cy="13.5" r="5.5" fill="white" opacity="0.95"/>'
    + '</svg>';
}

// ─── MARKERS ───
var searchQ = '';
var leafletMarkers = [];

stores.forEach(function(s) {
  var icon = L.divIcon({
    className: '',
    html: '<div class="mpin" style="transition:transform 0.15s;transform-origin:50% 100%;line-height:0">' + makePinHtml(s.state) + '</div>',
    iconSize:   [30, 39],
    iconAnchor: [15, 39],
    popupAnchor:[0, -42],
  });

  var m = L.marker([s.lat, s.lng], { icon: icon }).addTo(lmap);

  m.on('mouseover', function() {
    var el = m.getElement();
    if (el) el.querySelector('.mpin').style.transform = 'scale(1.3) translateY(-3px)';
  });
  m.on('mouseout', function() {
    var el = m.getElement();
    if (el) el.querySelector('.mpin').style.transform = '';
  });
  m.on('click', function() {
    openDetail(s);
    lmap.panTo([s.lat, s.lng], { animate: true });
    document.getElementById('sheet').classList.remove('expanded');
  });

  m.store = s;
  leafletMarkers.push(m);
});

// ─── DETAIL ───
function openDetail(store) {
  var c = stateColor(store.state);
  var badge = document.getElementById('detail-badge');
  badge.style.background = c.bg;
  badge.style.color = c.text;
  document.getElementById('detail-badge-dot').style.background = c.pin[0];
  document.getElementById('detail-state-text').textContent = store.state;
  document.getElementById('detail-name').textContent  = store.name;
  document.getElementById('detail-addr').textContent  = store.address;
  document.getElementById('detail-link').href =
    'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(store.name + ' ' + store.city);
  document.getElementById('detail').classList.add('open');
}
function closeDetail() { document.getElementById('detail').classList.remove('open'); }

// ─── VISIBILITY ───
function isVisible(s) {
  var matchState  = activeFilter === 'all' || s.state === activeFilter;
  var q = searchQ.toLowerCase();
  var matchSearch = !q || s.name.toLowerCase().includes(q) || s.city.toLowerCase().includes(q) || s.address.toLowerCase().includes(q);
  return matchState && matchSearch;
}

// ─── RENDER LISTS ───
function storeRowHTML(s) {
  var c = stateColor(s.state);
  return '<div class="store-row" data-id="'+s.id+'">'
    + '<div class="store-pin-icon" style="background:'+c.bg+'">'
    +   '<svg viewBox="0 0 24 24" fill="'+c.pin[0]+'"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>'
    + '</div>'
    + '<div class="store-info">'
    +   '<div class="store-row-name">'+s.name+'</div>'
    +   '<div class="store-row-sub">'
    +     '<span class="store-state-tag" style="background:'+c.bg+';color:'+c.text+'">'+s.state+'</span>'
    +     s.city
    +   '</div>'
    + '</div>'
    + '<div class="store-arrow"><svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></div>'
    + '</div>';
}

function bindListClicks(containerId) {
  var container = document.getElementById(containerId);
  if (!container) return;
  container.querySelectorAll('.store-row').forEach(function(row) {
    row.addEventListener('click', function() {
      var id = parseInt(row.getAttribute('data-id'));
      var store = stores.find(function(s){ return s.id === id; });
      if (!store) return;
      openDetail(store);
      lmap.flyTo([store.lat, store.lng], 14, { duration: 0.8 });
      document.getElementById('sheet').classList.remove('expanded');
    });
  });
}

function renderLists() {
  var vis = stores.filter(isVisible);
  var label = vis.length + ' loja' + (vis.length !== 1 ? 's' : '');
  document.getElementById('sheet-label').textContent = label;
  var sideLabel = document.getElementById('side-label');
  if (sideLabel) sideLabel.textContent = label;

  var html = vis.map(storeRowHTML).join('');
  document.getElementById('sheet-list').innerHTML = html;
  var sideList = document.getElementById('side-list');
  if (sideList) sideList.innerHTML = html;

  bindListClicks('sheet-list');
  bindListClicks('side-list');
}

function updateMarkers() {
  leafletMarkers.forEach(function(m) {
    var vis = isVisible(m.store);
    var el = m.getElement();
    if (el) el.style.opacity = vis ? '1' : '0.1';
    m.off('click');
    if (vis) {
      m.on('click', (function(store) {
        return function() {
          openDetail(store);
          lmap.panTo([store.lat, store.lng]);
          document.getElementById('sheet').classList.remove('expanded');
        };
      })(m.store));
    }
  });
}

// ─── FILTER ───
function setFilter(f) {
  activeFilter = f;
  buildPills(); // rebuilds with correct active state
  updateMarkers(); renderLists(); closeDetail();
  if (f === 'all') {
    lmap.flyTo([-22.5, -46.8], 7, { duration: 0.9 });
  } else {
    var vis = stores.filter(function(s){ return s.state === f; });
    if (vis.length > 0) {
      var bounds = L.latLngBounds(vis.map(function(s){ return [s.lat, s.lng]; }));
      lmap.flyToBounds(bounds, { padding: [60, 60], duration: 0.9 });
    }
  }
}

// ─── SEARCH ───
document.getElementById('search-input').addEventListener('input', function(e) {
  searchQ = e.target.value;
  updateMarkers(); renderLists(); closeDetail();
  var vis = stores.filter(isVisible);
  if (vis.length === 1) {
    lmap.flyTo([vis[0].lat, vis[0].lng], 14, { duration: 0.8 });
  } else if (vis.length >= 2 && vis.length <= 8) {
    var bounds = L.latLngBounds(vis.map(function(s){ return [s.lat, s.lng]; }));
    lmap.flyToBounds(bounds, { padding: [60, 60], duration: 0.8 });
  }
});

// ─── BOTTOM SHEET DRAG ───
var sheet = document.getElementById('sheet');
var sheetHandle = document.getElementById('sheet-handle');
var dragStartY = 0, dragging = false;

sheetHandle.addEventListener('touchstart', function(e) {
  dragStartY = e.touches[0].clientY; dragging = true;
}, { passive: true });

window.addEventListener('touchmove', function(e) {
  if (!dragging) return;
  var dy = e.touches[0].clientY - dragStartY;
  if (dy < -30)  { sheet.classList.add('expanded');    dragging = false; }
  if (dy >  30)  { sheet.classList.remove('expanded'); dragging = false; }
}, { passive: true });

window.addEventListener('touchend', function() { dragging = false; });
sheetHandle.addEventListener('click', function() { sheet.classList.toggle('expanded'); });

// Close detail on map click
document.getElementById('map').addEventListener('click', function(e) {
  if (!e.target.closest('.mpin')) closeDetail();
});

// ─── INIT ───
renderLists();
</script>
</body>
</html>
